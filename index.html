<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet - Video Conferencing</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#3b82f6',
                            600: '#2563eb',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS for specific styling -->
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
        .video-container { position: relative; background: #000; border-radius: 0.5rem; overflow: hidden; aspect-ratio: 16/9; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .name-label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6); color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.875rem; }
        /* Hide sections by default */
        .hidden-section { display: none !important; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col text-gray-800">

    <!-- 1. Landing / Entry Screen -->
    <div id="landing-screen" class="flex-1 flex items-center justify-center bg-gray-900 text-white">
        <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md text-center">
            <h1 class="text-3xl font-bold mb-6 flex justify-center items-center gap-2">
                <i class="fa-solid fa-video text-brand-500"></i> Meet App
            </h1>
            
            <!-- User Join Section -->
            <div id="user-join-section" class="mb-8">
                <h2 class="text-xl font-semibold mb-4 text-gray-300">Join a Meeting</h2>
                <input type="text" id="join-name" placeholder="Your Name" class="w-full p-3 rounded bg-gray-700 border border-gray-600 mb-4 focus:outline-none focus:border-brand-500 text-white">
                <button id="btn-request-join" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-3 px-4 rounded transition">
                    Ask to Join
                </button>
                <p id="join-error" class="text-red-400 text-sm mt-2 hidden"></p>
            </div>

            <hr class="border-gray-700 my-6">

            <!-- Admin Section -->
            <div>
                <button id="btn-show-admin-login" class="text-gray-400 hover:text-white text-sm underline transition">
                    Are you the Admin? Login here.
                </button>
            </div>
        </div>
    </div>

    <!-- 2. Admin Login Overlay -->
    <div id="admin-login-overlay" class="hidden-section fixed inset-0 bg-black/80 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-sm">
            <h2 class="text-2xl font-bold mb-6 text-gray-900 text-center">Admin Login</h2>
            <input type="text" id="admin-id" placeholder="Admin ID" class="w-full p-3 rounded border border-gray-300 mb-4 focus:outline-none focus:border-brand-500 text-gray-900">
            <input type="password" id="admin-pass" placeholder="Password" class="w-full p-3 rounded border border-gray-300 mb-6 focus:outline-none focus:border-brand-500 text-gray-900">
            <div class="flex gap-4">
                <button id="btn-cancel-admin" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded transition">Cancel</button>
                <button id="btn-admin-login" class="flex-1 bg-brand-600 hover:bg-brand-500 text-white font-bold py-2 px-4 rounded transition">Login</button>
            </div>
            <p id="login-error" class="text-red-500 text-sm mt-4 text-center hidden">Invalid ID or Password</p>
        </div>
    </div>

    <!-- 3. Waiting Room Screen (For Users) -->
    <div id="waiting-screen" class="hidden-section flex-1 items-center justify-center bg-gray-900 text-white flex-col">
        <div class="animate-pulse bg-gray-800 p-8 rounded-full shadow-lg mb-6">
            <i class="fa-solid fa-hourglass-half text-4xl text-brand-500"></i>
        </div>
        <h2 class="text-2xl font-semibold mb-2">Waiting for the host to let you in...</h2>
        <p class="text-gray-400">Please wait. The meeting admin will approve your request shortly.</p>
    </div>

    <!-- 4. Main Meeting / Admin Dashboard -->
    <div id="meeting-screen" class="hidden-section flex-1 flex flex-col bg-gray-900 text-white h-full relative">
        
        <!-- Header / Admin Controls -->
        <header class="bg-gray-800 p-4 flex justify-between items-center shadow-md z-10">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold flex items-center gap-2"><i class="fa-solid fa-video text-brand-500"></i> Meet</h1>
                
                <!-- Admin specific info -->
                <div id="admin-controls-header" class="hidden bg-gray-700 px-4 py-2 rounded-lg flex items-center gap-3">
                    <span class="text-sm text-gray-300">Invite Link:</span>
                    <input type="text" id="invite-link" readonly class="bg-gray-800 border border-gray-600 rounded px-2 py-1 text-sm text-gray-300 w-64 focus:outline-none">
                    <button id="btn-copy-link" class="text-brand-500 hover:text-brand-400 transition"><i class="fa-regular fa-copy"></i></button>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <!-- Recording indicator -->
                <div id="recording-indicator" class="hidden flex items-center gap-2 text-red-500 font-semibold animate-pulse">
                    <div class="w-3 h-3 bg-red-500 rounded-full"></div> REC
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 flex overflow-hidden">
            
            <!-- Video Grid Area -->
            <div class="flex-1 p-4 overflow-y-auto">
                <div id="video-grid" class="video-grid h-full">
                    <!-- Local Video -->
                    <div class="video-container shadow-lg">
                        <video id="local-video" autoplay muted playsinline></video>
                        <div class="name-label">You</div>
                    </div>
                </div>
            </div>

            <!-- Admin Sidebar (Join Requests) -->
            <div id="admin-sidebar" class="hidden w-80 bg-gray-800 border-l border-gray-700 flex flex-col">
                <div class="p-4 border-b border-gray-700">
                    <h2 class="text-lg font-semibold flex items-center justify-between">
                        Join Requests <span id="request-count" class="bg-brand-600 text-xs px-2 py-1 rounded-full">0</span>
                    </h2>
                </div>
                <div id="requests-list" class="flex-1 overflow-y-auto p-4 space-y-4">
                    <!-- Requests will be injected here -->
                    <div id="no-requests" class="text-gray-500 text-sm text-center mt-4">No pending requests</div>
                </div>
            </div>
        </main>

        <!-- Bottom Control Bar -->
        <footer class="bg-gray-800 p-4 flex justify-center gap-6 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
            <button id="btn-toggle-audio" class="w-12 h-12 rounded-full bg-gray-700 hover:bg-gray-600 text-white flex items-center justify-center transition focus:outline-none">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <button id="btn-toggle-video" class="w-12 h-12 rounded-full bg-gray-700 hover:bg-gray-600 text-white flex items-center justify-center transition focus:outline-none">
                <i class="fa-solid fa-video"></i>
            </button>
            
            <!-- Admin Only Record Button -->
            <button id="btn-record" class="hidden w-12 h-12 rounded-full bg-gray-700 hover:bg-red-600 hover:text-white text-gray-300 flex items-center justify-center transition focus:outline-none group relative">
                <i class="fa-solid fa-record-vinyl group-hover:animate-spin"></i>
            </button>
            
            <button id="btn-leave" class="w-12 h-12 rounded-full bg-red-600 hover:bg-red-700 text-white flex items-center justify-center transition focus:outline-none">
                <i class="fa-solid fa-phone-slash"></i>
            </button>
        </footer>
    </div>

    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Main Application Logic -->
    <script src="app.js"></script>
</body>
</html>
